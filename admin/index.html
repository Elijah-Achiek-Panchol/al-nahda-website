<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Nahda Academy Content Manager</title>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body>
    <script>
        // Set up the configuration programmatically for simplicity
        CMS.init({
            config: {
                backend: {
                    name: "git-gateway",
                    branch: "main" // Adjust if your main code repository uses a different default branch
                },
                media_folder: "assets/images",
                public_folder: "/assets/images",
                collections: [
                    {
                        name: "blog",
                        label: "Blog Posts",
                        folder: "blog-posts",
                        create: true,
                        slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
                        fields: [
                            { label: "Title", name: "title", widget: "string" },
                            { label: "Publish Date", name: "date", widget: "datetime" },
                            { label: "Summary Snippet", name: "summary", widget: "text" },
                            { label: "Body Content", name: "body", widget: "markdown" }
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
